name: Backend & Agent CI

on:
  push:
    paths:
      - "apps/backend/**"
      - "apps/agent/**"
      - "packages/**"
  pull_request:
    paths:
      - "apps/backend/**"
      - "apps/agent/**"
      - "packages/**"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm --workspace @xor/backend run typecheck
      - run: npm --workspace @xor/agent run typecheck

